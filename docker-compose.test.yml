services:
  postgres-test:
    image: postgres:17
    container_name: sharedspace-postgres-test
    environment:
      POSTGRES_USER: sharedspace_test
      POSTGRES_PASSWORD: sharedspace_test
      POSTGRES_DB: sharedspace_test
    ports:
      - '5433:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sharedspace_test -d sharedspace_test']
      interval: 2s
      timeout: 5s
      retries: 15
